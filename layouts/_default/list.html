{{ define "main" }}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
  <header class="mb-8 border-b border-gray-200 pb-4">
    <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 tracking-tight">
      {{ .Title }}
    </h1>
    {{ with .Description }}
      <p class="text-lg text-gray-600 mt-2">{{ . }}</p>
    {{ end }}
  </header>

  {{ if .Content }}
    <div class="prose max-w-none text-gray-800 mb-10">
      {{ .Content }}
    </div>
  {{ end }}

  {{ if .Pages }}
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      {{ range .Pages }}
        <a href="{{ .RelPermalink }}" class="faf-card p-6 block group hover:no-underline">
          <h2 class="text-xl font-bold text-gray-900 group-hover:text-primary-600 transition-colors mb-2">
            {{ .Title }}
          </h2>
          {{ with .Description }}
            <p class="text-sm text-gray-600 line-clamp-3">{{ . }}</p>
          {{ end }}
        </a>
      {{ end }}
    </div>
  {{ end }}
</div>
{{ end }}
