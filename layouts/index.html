{{ define "main" }}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6 pb-12">

  <!-- HERO SECTION WITH OVERLAID LOGO_LIGHT.PNG -->
  <section class="faf-home-hero relative md:rounded-3xl overflow-hidden shadow-2xl">
    <!-- Hero Background Image -->
    <div class="absolute inset-0 z-0">
      <img src="{{ "img/reflejo_zhurba_vera.webp" | relURL }}" alt="Priego de Córdoba" class="w-full h-full object-cover nozoom" />
      <!-- Gradient Overlay for Contrast -->
      <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/40 to-black/30"></div>
    </div>


    <!-- Hero Content -->
    <div class="relative z-10 py-16 px-6 sm:py-24 sm:px-12 md:py-28 text-center max-w-4xl mx-auto flex flex-col items-center justify-center">

      <!-- Congress Main Logo (Logo Light) -->
      <img src="{{ "img/logo_light_new.webp" | relURL }}" alt="FAF Congreso de Fotografía Priego de Córdoba 2027" class="faf-hero-logo mb-6 nozoom" />

      <!-- Subtitle Date & Location -->
      <h2 class="text-xl sm:text-2xl md:text-3xl font-extrabold text-white uppercase tracking-wider drop-shadow-md">
        IX CONGRESO FEDERACIÓN ANDALUZA DE FOTOGRAFÍA <br> PRIEGO DE CÓRDOBA &middot; MARZO 2027
      </h2>

      <!-- Pill Action Buttons -->
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-4 sm:gap-6">
        <a href="{{ "/programa/" | relLangURL }}" class="btn-pill-green text-sm sm:text-base">
          VER PROGRAMA
        </a>
        <a href="{{ "/priego/" | relLangURL }}" class="btn-pill-blue text-sm sm:text-base">
          DESCUBRIR PRIEGO
        </a>
        <a href="{{ "/inscripcion/" | relLangURL }}" class="btn-pill-green text-sm sm:text-base">
          INSCRIBIRSE
        </a>
      </div>

    </div>
  </section>

  <!-- 3 FEATURE CARDS SECTION -->
  <section class="mb-16">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 lg:gap-8">

      <!-- Card 1 -->
      <a href="{{ "/bienvenida/" | relLangURL }}" class="faf-card block group">
        <div class="aspect-[4/3] overflow-hidden bg-gray-100">
          <img src="{{ "img/ayuntamiento.webp" | relURL }}" alt="Datos del congreso" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 nozoom" />
        </div>
        <h3 class="faf-card-title">Información</h3>
      </a>

      <!-- Card 2 -->
      <a href="{{ "/concursos/" | relLangURL }}" class="faf-card block group">
        <div class="aspect-[4/3] overflow-hidden bg-gray-100">
          <img src="{{ "img/concursos.webp" | relURL }}" alt="Concursos" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 nozoom" />
        </div>
        <h3 class="faf-card-title">Concursos</h3>
      </a>

      <!-- Card 3 -->
      <a href="{{ "/actividades/" | relLangURL }}" class="faf-card block group">
        <div class="aspect-[4/3] overflow-hidden bg-gray-100">
          <img src="{{ "img/taller.webp" | relURL }}" alt="Talleres en exteriores  y actividades" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 nozoom" />
        </div>
        <h3 class="faf-card-title">Actividades</h3>
      </a>

    </div>
  </section>

  <section class="mb-16" aria-labelledby="sponsors-heading">
    <h2 id="sponsors-heading" class="mb-6 text-center text-2xl font-bold">Patrocinadores del congreso</h2>
    <div class="faf-sponsor-group faf-sponsor-group--gold">
      <ul class="faf-sponsor-grid faf-sponsor-grid--gold">
        <li class="faf-sponsor-card faf-sponsor-card--gold">
          <img src="{{ "img/logo_iberplus_adarve.webp" | relURL }}" alt="Iberplusr" class="faf-sponsor-logo faf-sponsor-logo--gold nozoom" />
        </li>
        <li class="faf-sponsor-card faf-sponsor-card--gold">
          <img src="{{ "img/logo_vizcantar.webp" | relURL }}" alt="Vizcántar" class="faf-sponsor-logo faf-sponsor-logo--gold nozoom" />
        </li>
        <li class="faf-sponsor-card faf-sponsor-card--gold">
          <img src="{{ "img/logo_dip_cordoba.webp" | relURL }}" alt="DiputaciónCórdoba" class="faf-sponsor-logo faf-sponsor-logo--gold nozoom" />
        </li>
        <li class="faf-sponsor-card faf-sponsor-card--gold">
          <img src="{{ "img/logo_priego_completo.webp" | relURL }}" alt="Priego" class="faf-sponsor-logo faf-sponsor-logo--gold nozoom" />
        </li>
      </ul>
    </div>

    <div class="faf-sponsor-group faf-sponsor-group--regular">
      <h3 class="faf-sponsor-heading">Colaboradores del Congreso</h3>
      <ul class="faf-sponsor-grid faf-sponsor-grid--regular">
        <li class="faf-sponsor-card">
          <a href="https://www.espinacco.es/es/" target="_blank">
          <img src="{{ "img/logo_espinacco_design.webp" | relURL }}" alt="Espinacco Design" class="faf-sponsor-logo faf-sponsor-logo--regular nozoom" />
        </a>
        </li>
        <li class="faf-sponsor-card">
          <img src="{{ "img/logo_cmp.webp" | relURL }}" alt="CMP" class="faf-sponsor-logo faf-sponsor-logo--regular nozoom" />
        </li>
        <li class="faf-sponsor-card">
          <img src="{{ "img/logo_rojas2.webp" | relURL }}" alt="Rojas" class="faf-sponsor-logo faf-sponsor-logo--regular nozoom" />
        </li>
        <li class="faf-sponsor-card">
          <img src="{{ "img/logo_do.webp" | relURL }}" alt="DO" class="faf-sponsor-logo faf-sponsor-logo--regular nozoom" />
        </li>
        <li class="faf-sponsor-card">
          <img src="{{ "img/logo_amigosbiblioteca.webp" | relURL }}" alt="Amigos de la Biblioteca" class="faf-sponsor-logo faf-sponsor-logo--regular nozoom" />
        </li>
        <li class="faf-sponsor-card">
          <img src="{{ "img/logo_jazzpc.webp" | relURL }}" alt="Jazz PC" class="faf-sponsor-logo faf-sponsor-logo--regular nozoom" />
        </li>
      </ul>
    </div>
  </section>

</div>
{{ end }}
